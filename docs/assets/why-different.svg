<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="why-different-title">
  <title id="why-different-title">Typical cloud assistant vs. Meridian Assistant</title>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <text x="230" y="75" text-anchor="middle" fill="#94a3b8"
        font-size="13">TYPICAL CLOUD ASSISTANT</text>

  <text x="670" y="75" text-anchor="middle" fill="#18b480"
        font-size="13" filter="url(#glow)">MERIDIAN ASSISTANT</text>

  <line x1="450" y1="60" x2="450" y2="300"
        stroke="#334155" stroke-width="1"/>

  <!-- row 1 -->
  <text x="230" y="120" text-anchor="middle" fill="#94a3b8" font-size="14">
    Cloud inference
  </text>
  <text x="450" y="120" text-anchor="middle" fill="#475569" font-size="15">→</text>
  <text x="670" y="120" text-anchor="middle" fill="#18b480" font-size="14">
    Local inference
  </text>

  <!-- row 2 -->
  <text x="230" y="160" text-anchor="middle" fill="#94a3b8" font-size="14">
    Remote embeddings
  </text>
  <text x="450" y="160" text-anchor="middle" fill="#475569" font-size="15">→</text>
  <text x="670" y="160" text-anchor="middle" fill="#18b480" font-size="14">
    Local embeddings
  </text>

  <!-- row 3 -->
  <text x="230" y="200" text-anchor="middle" fill="#94a3b8" font-size="14">
    Model-generated claims
  </text>
  <text x="450" y="200" text-anchor="middle" fill="#475569" font-size="15">→</text>
  <text x="670" y="200" text-anchor="middle" fill="#18b480" font-size="14">
    Grounded citations
  </text>

  <!-- row 4 -->
  <text x="230" y="240" text-anchor="middle" fill="#94a3b8" font-size="14">
    Fixed compute
  </text>
  <text x="450" y="240" text-anchor="middle" fill="#475569" font-size="15">→</text>
  <text x="670" y="240" text-anchor="middle" fill="#18b480" font-size="14">
    Hardware-aware + P2P
  </text>

  <!-- row 5 -->
  <text x="230" y="280" text-anchor="middle" fill="#94a3b8" font-size="14">
    Vendor-specific client
  </text>
  <text x="450" y="280" text-anchor="middle" fill="#475569" font-size="15">→</text>
  <text x="670" y="280" text-anchor="middle" fill="#18b480" font-size="14">
    OpenAI-compatible API
  </text>
</svg>
