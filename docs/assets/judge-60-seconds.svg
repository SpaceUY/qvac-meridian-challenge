<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-labelledby="judge-60-title">
  <title id="judge-60-title">Judge this project in 60 seconds — install, fetch models, ingest corpus, serve, go offline, ask, verify citations</title>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle"
        fill="#94a3b8" font-size="13" letter-spacing="3">
    JUDGE THIS PROJECT IN 60 SECONDS
  </text>

  <line x1="80" y1="115" x2="820" y2="115"
        stroke="#334155"/>

  <!-- 1 -->
  <circle cx="90" cy="115" r="20" fill="none" stroke="#2dd4bf"/>
  <text x="90" y="120" text-anchor="middle" fill="#2dd4bf" font-size="12">01</text>
  <text x="90" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">INSTALL</text>

  <!-- 2 -->
  <circle cx="210" cy="115" r="20" fill="none" stroke="#2dd4bf"/>
  <text x="210" y="120" text-anchor="middle" fill="#2dd4bf" font-size="12">02</text>
  <text x="210" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">FETCH</text>

  <!-- 3 -->
  <circle cx="330" cy="115" r="20" fill="none" stroke="#2dd4bf"/>
  <text x="330" y="120" text-anchor="middle" fill="#2dd4bf" font-size="12">03</text>
  <text x="330" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">INGEST</text>

  <!-- 4 -->
  <circle cx="450" cy="115" r="20" fill="none" stroke="#2dd4bf"/>
  <text x="450" y="120" text-anchor="middle" fill="#2dd4bf" font-size="12">04</text>
  <text x="450" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">SERVE</text>

  <!-- 5 -->
  <circle cx="570" cy="115" r="20" fill="none" stroke="#2dd4bf"/>
  <text x="570" y="120" text-anchor="middle" fill="#2dd4bf" font-size="12">05</text>
  <text x="570" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">GO OFFLINE</text>

  <!-- 6 -->
  <circle cx="690" cy="115" r="20" fill="none" stroke="#2dd4bf"/>
  <text x="690" y="120" text-anchor="middle" fill="#2dd4bf" font-size="12">06</text>
  <text x="690" y="160" text-anchor="middle" fill="#94a3b8" font-size="10">ASK</text>

  <!-- 7 -->
  <circle cx="810" cy="115" r="23"
          fill="none" stroke="#2dd4bf" stroke-width="2"
          filter="url(#glow)"/>
  <text x="810" y="120" text-anchor="middle"
        fill="#2dd4bf" font-size="12">07</text>
  <text x="810" y="160" text-anchor="middle"
        fill="#2dd4bf" font-size="10">VERIFY</text>
  <text x="810" y="178" text-anchor="middle"
        fill="#94a3b8" font-size="9">citations[]</text>

  <text x="450" y="210" text-anchor="middle"
        fill="#64748b" font-size="10">
    no outbound network required during evaluation
  </text>
</svg>
