<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-labelledby="problem-title">
  <title id="problem-title">Why the first cloud pilot failed — cost, margin, data, trust</title>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <text x="450" y="30" text-anchor="middle"
        fill="#94a3b8" font-size="13" letter-spacing="3">
    WHY THE FIRST PILOT FAILED
  </text>

  <line x1="225" y1="75" x2="225" y2="180" stroke="#334155"/>
  <line x1="450" y1="75" x2="450" y2="180" stroke="#334155"/>
  <line x1="675" y1="75" x2="675" y2="180" stroke="#334155"/>

  <text x="112.5" y="105" text-anchor="middle"
        fill="#2dd4bf" font-size="15"
        filter="url(#glow)">COST</text>
  <text x="112.5" y="140" text-anchor="middle"
        fill="#94a3b8" font-size="11">metered tokens</text>
  <text x="112.5" y="160" text-anchor="middle"
        fill="#64748b" font-size="10">no predictable ceiling</text>

  <text x="337.5" y="105" text-anchor="middle"
        fill="#2dd4bf" font-size="15"
        filter="url(#glow)">MARGIN</text>
  <text x="337.5" y="140" text-anchor="middle"
        fill="#94a3b8" font-size="11">opaque query cost</text>
  <text x="337.5" y="160" text-anchor="middle"
        fill="#64748b" font-size="10">hard to forecast</text>

  <text x="562.5" y="105" text-anchor="middle"
        fill="#2dd4bf" font-size="15"
        filter="url(#glow)">DATA</text>
  <text x="562.5" y="140" text-anchor="middle"
        fill="#94a3b8" font-size="11">customer context</text>
  <text x="562.5" y="160" text-anchor="middle"
        fill="#64748b" font-size="10">left Meridian hardware</text>

  <text x="787.5" y="105" text-anchor="middle"
        fill="#2dd4bf" font-size="15"
        filter="url(#glow)">TRUST</text>
  <text x="787.5" y="140" text-anchor="middle"
        fill="#94a3b8" font-size="11">wrong answers</text>
  <text x="787.5" y="160" text-anchor="middle"
        fill="#64748b" font-size="10">carry real business risk</text>

  <text x="450" y="210" text-anchor="middle"
        fill="#94a3b8" font-size="11">
    the problem wasn't chat UX — it was architecture
  </text>
</svg>
