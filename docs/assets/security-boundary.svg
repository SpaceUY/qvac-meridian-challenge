<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" role="img" aria-labelledby="security-boundary-title">
  <title id="security-boundary-title">What leaves the device — everything stays local except optional chat-completion delegation to a Meridian-controlled peer; public cloud AI has no connection</title>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- local boundary -->
  <rect x="30" y="60" width="520" height="270" rx="10"
        fill="none" stroke="#18b480" stroke-width="1.5"
        stroke-dasharray="6 6"/>

  <text x="50" y="86" fill="#18b480"
        font-size="11" letter-spacing="1">
    THIS DEVICE
  </text>

  <text x="75" y="125" fill="#94a3b8" font-size="12">✓ corpus documents</text>
  <text x="75" y="155" fill="#94a3b8" font-size="12">✓ embeddings</text>
  <text x="75" y="185" fill="#94a3b8" font-size="12">✓ LanceDB vector store</text>
  <text x="75" y="215" fill="#94a3b8" font-size="12">✓ retrieved context</text>

  <text x="310" y="125" fill="#94a3b8" font-size="12">✓ prompts</text>
  <text x="310" y="155" fill="#94a3b8" font-size="12">✓ generated answers</text>
  <text x="310" y="185" fill="#94a3b8" font-size="12">✓ stock / pricing data</text>
  <text x="310" y="215" fill="#94a3b8" font-size="12">✓ RAG / STT / TTS</text>

  <text x="290" y="285" text-anchor="middle"
        fill="#18b480" font-size="15"
        filter="url(#glow)">
    stays local
  </text>

  <!-- peer -->
  <rect x="625" y="85" width="240" height="110" rx="8"
        fill="none" stroke="#334155"/>

  <text x="745" y="118" text-anchor="middle"
        fill="#18b480" font-size="13">
    MERIDIAN PEER
  </text>
  <text x="745" y="145" text-anchor="middle"
        fill="#94a3b8" font-size="10.5">
    optional · public-key controlled
  </text>
  <text x="745" y="166" text-anchor="middle"
        fill="#64748b" font-size="10">
    chat inference only
  </text>

  <!-- peer arrow -->
  <line x1="550" y1="140" x2="625" y2="140"
        stroke="#18b480" stroke-width="1.5"/>

  <path d="M615 134 L625 140 L615 146"
        fill="none" stroke="#18b480"/>

  <text x="587" y="125" text-anchor="middle"
        fill="#64748b" font-size="9">
    optional
  </text>

  <!-- cloud -->
  <rect x="625" y="240" width="240" height="90" rx="8"
        fill="none" stroke="#475569"
        stroke-dasharray="4 5"/>

  <text x="745" y="270" text-anchor="middle"
        fill="#94a3b8" font-size="12">
    PUBLIC CLOUD AI
  </text>

  <text x="745" y="302" text-anchor="middle"
        fill="#f87171" font-size="15"
        filter="url(#glow)">
    NO CONNECTION
  </text>

  <!-- X -->
  <line x1="575" y1="260" x2="605" y2="290"
        stroke="#f87171" stroke-width="2"/>
  <line x1="605" y1="260" x2="575" y2="290"
        stroke="#f87171" stroke-width="2"/>

  <text x="450" y="365" text-anchor="middle"
        fill="#64748b" font-size="10">
    peer failure → automatic local fallback
  </text>
</svg>
